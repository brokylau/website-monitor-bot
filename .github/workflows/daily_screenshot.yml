name: Daily Screenshot & Feishu Bot

on:
  schedule:
    - cron: '47 22 * * *'
  workflow_dispatch:


permissions:
  contents: write # 极度重要：赋予机器人将生成的图片 Push 回仓库的权限

jobs:
  run-screenshot-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Run Screenshot Script
        env:
          # 将我们刚才在 Secrets 里存的飞书链接提取出来，喂给 Python 脚本
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }} 
          AIHOT_MAX_ITEMS: ${{ vars.AIHOT_MAX_ITEMS }}
          AIHOT_MIN_SCORE: ${{ vars.AIHOT_MIN_SCORE }}
        run: python screenshot_bot.py

      - name: Commit and Push Images to Repo
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add screenshots/

          if [ -f aihot_state.json ]; then
            git add aihot_state.json
          else
            echo "aihot_state.json not found, skip adding state file"
          fi

          git commit -m "Auto-update daily screenshots and AI HOT state [skip ci]" || echo "No changes to commit"
          git push

